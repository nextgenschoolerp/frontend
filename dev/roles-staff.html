<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Roles and staff</title>
<!--
  Dev-only page (served by the Vite dev server at /dev/roles-staff.html, not part of the production build).
  Shows which staff hold which role, from authservice:
    GET /api/v1/tenants                      the schools (societies) and their campuses
    GET /api/v1/tenants/{tenantId}/users     every account of the school with its roles (SUPER_ADMIN only)
    GET /api/v1/roles                        all roles with their description (so roles nobody holds are listed too)
  Sign in with a SUPER_ADMIN username; the password is the shared test password. Nothing is written.
  Two views: "By role" (each role with the people who hold it) and "By staff" (each person with their roles).
-->
<style>
  :root{--bg:#f6f6f4;--card:#fff;--bd:#e6e5e0;--tx:#24283b;--mu:#555867;--pr:#5f53a8;--tint:#efedf9;
    --gr:#1d6b54;--grt:#e7f4ec;--am:#7d5016;--amt:#fbf2df;--rd:#9b2f33;--rdt:#f9e8e9}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--tx);font:400 13px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button,select,input{font:inherit;color:inherit}
  button{cursor:pointer}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
  .sub{color:var(--mu);margin-top:4px;max-width:760px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px 18px;margin-top:16px}
  .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
  .form label{display:block;font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--mu);margin-bottom:5px;text-transform:uppercase}
  .form select,.form input,.search{width:100%;height:36px;border:1px solid #8a8d99;border-radius:8px;padding:0 10px;background:var(--card)}
  .btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center}
  .btn.primary{background:var(--pr);border-color:var(--pr);color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd)}
  .tabs button{border:0;background:none;padding:8px 14px;font-weight:600;color:var(--mu);border-bottom:2px solid transparent}
  .tabs button.on{color:var(--pr);border-color:var(--pr)}
  .search{max-width:300px}
  .status{margin-top:12px;color:var(--mu)}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;margin:1px 4px 1px 0}
  .pill.role{background:var(--tint);color:var(--pr)} .pill.ok{background:var(--grt);color:var(--gr)} .pill.warn{background:var(--amt);color:var(--am)} .pill.no{background:var(--rdt);color:var(--rd)} .pill.none{background:#efeee9;color:var(--mu)}
  .role{border:1px solid var(--bd);border-radius:10px;margin-top:10px;background:var(--card)}
  .role summary{list-style:none;display:flex;gap:10px;align-items:center;padding:10px 14px;cursor:pointer}
  .role summary::-webkit-details-marker{display:none}
  .role summary b{font-size:14px}
  .role summary .desc{color:var(--mu);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .count{min-width:28px;text-align:center;padding:2px 8px;border-radius:999px;background:var(--tint);color:var(--pr);font-weight:700}
  .count.zero{background:#efeee9;color:var(--mu)}
  table{width:100%;border-collapse:collapse}
  th{font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--mu);text-align:left;padding:6px 8px;text-transform:uppercase;border-bottom:1px solid var(--bd)}
  td{padding:8px;border-bottom:1px solid var(--bd);vertical-align:top}
  .role table{margin:0 0 6px}
  .role .empty{padding:4px 14px 12px;color:var(--mu)}
  .muted{color:var(--mu)} .small{font-size:11px}
  .tools{margin-left:auto;display:flex;gap:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Roles and staff</h1>
  <p class="sub">Which staff hold which role. Pick a school, optionally a campus, and switch between the role view and the staff view. Read-only; data comes from authservice.</p>

  <div class="card">
    <div class="form">
      <div><label for="admin">SUPER_ADMIN username</label><input id="admin" value="superadmin_mahesh" autocomplete="off" /></div>
      <div><label for="password">Password</label><input id="password" type="password" value="Password@123" autocomplete="off" /></div>
      <div><button id="load" class="btn primary" style="width:100%">Load schools</button></div>
      <div><label for="school">School</label><select id="school" disabled></select></div>
      <div><label for="campus">Campus</label><select id="campus" disabled><option value="">All campuses</option></select></div>
    </div>
    <p id="status" class="status">Sign in and load the schools.</p>
  </div>

  <div id="main" hidden>
    <div class="bar">
      <div class="tabs" role="tablist">
        <button id="tabRole" role="tab" class="on">By role</button>
        <button id="tabStaff" role="tab">By staff</button>
      </div>
      <input id="q" class="search" type="search" placeholder="Search name, username or role" aria-label="Search" />
      <label class="small muted"><input id="onlyUsed" type="checkbox" /> Hide roles nobody holds</label>
      <div class="tools"><button id="csv" class="btn">Download CSV</button></div>
    </div>
    <div id="out"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const label = (code) => code.toLowerCase().split('_').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
let token = '', SCHOOLS = [], ROLES = [], STAFF = [], view = 'role';

async function api(path) {
  const r = await fetch(path, { headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' } });
  const j = await r.json().catch(() => null);
  if (!r.ok || j?.success === false) throw new Error(`${path.split('?')[0]} → ${r.status}: ${j?.message || 'request failed'}`);
  return j.data;
}

async function loadSchools() {
  $('status').textContent = 'Signing in…';
  try {
    const r = await fetch('/api/v1/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: $('admin').value.trim(), password: $('password').value }) });
    const j = await r.json().catch(() => null);
    if (!r.ok || !j?.data?.accessToken) throw new Error(j?.message || `sign-in failed (${r.status})`);
    token = j.data.accessToken;
    SCHOOLS = await api('/api/v1/tenants');
    ROLES = await api('/api/v1/roles');
    $('school').innerHTML = SCHOOLS.map((t) => `<option value="${esc(t.tenantId)}">${esc(t.societyName)}</option>`).join('');
    $('school').disabled = false;
    await schoolChanged(j.data.tenantId);
  } catch (e) {
    $('status').innerHTML = `<span class="pill no">${esc(e.message)}</span> Use a SUPER_ADMIN username with the shared password.`;
  }
}

async function schoolChanged(prefer) {
  if (prefer && SCHOOLS.some((t) => t.tenantId === prefer)) $('school').value = prefer;
  const school = SCHOOLS.find((t) => t.tenantId === $('school').value);
  $('campus').innerHTML = '<option value="">All campuses</option>' + (school?.campuses || []).map((c) => `<option value="${esc(c.branchCode)}">${esc(c.branchName)} (${esc(c.branchCode)})</option>`).join('');
  $('campus').disabled = false;
  await loadStaff();
}

async function loadStaff() {
  $('status').textContent = 'Loading staff…';
  try {
    const branch = $('campus').value;
    const list = await api(`/api/v1/tenants/${encodeURIComponent($('school').value)}/users${branch ? `?branchId=${encodeURIComponent(branch)}` : ''}`);
    STAFF = list.map((u) => ({
      name: `${u.firstName || ''} ${u.lastName || ''}`.trim() || u.username, username: u.username, email: u.email, branch: u.branchId || '',
      roles: [...new Set((u.roles || []).map((x) => x.replace(/^ROLE_/, '')))].sort(),
      state: !u.active ? 'Inactive' : u.locked ? 'Locked' : u.mustChangePassword ? 'Must change password' : 'Active',
    })).sort((a, b) => a.name.localeCompare(b.name));
    $('main').hidden = false;
    const held = new Set(STAFF.flatMap((s) => s.roles));
    $('status').textContent = `${STAFF.length} accounts, ${held.size} of ${ROLES.length} roles in use.`;
    render();
  } catch (e) {
    $('status').innerHTML = `<span class="pill no">${esc(e.message)}</span>`;
  }
}

const stateTone = (s) => (s === 'Active' ? 'ok' : s === 'Inactive' ? 'none' : 'warn');
const matches = (q, ...parts) => !q || parts.join(' ').toLowerCase().includes(q);

function render() {
  const q = $('q').value.trim().toLowerCase();
  $('tabRole').className = view === 'role' ? 'on' : '';
  $('tabStaff').className = view === 'staff' ? 'on' : '';
  $('out').innerHTML = view === 'role' ? byRole(q) : byStaff(q);
}

function byRole(q) {
  const names = new Set([...ROLES.map((r) => r.name), ...STAFF.flatMap((s) => s.roles)]);
  const desc = Object.fromEntries(ROLES.map((r) => [r.name, r.description || '']));
  const rows = [...names].map((name) => ({ name, description: desc[name] || '', people: STAFF.filter((s) => s.roles.includes(name)) }))
    .filter((r) => !($('onlyUsed').checked && !r.people.length))
    .filter((r) => matches(q, r.name, label(r.name), r.description, r.people.map((p) => `${p.name} ${p.username}`).join(' ')))
    .sort((a, b) => b.people.length - a.people.length || a.name.localeCompare(b.name));
  if (!rows.length) return '<p class="status">Nothing matches.</p>';
  return rows.map((r) => `
    <details class="role" ${q && r.people.length ? 'open' : ''}>
      <summary><b>${esc(label(r.name))}</b><span class="desc">${esc(r.description)}</span><span class="count ${r.people.length ? '' : 'zero'}">${r.people.length}</span></summary>
      ${r.people.length ? `<table><thead><tr><th>Staff</th><th>Username</th><th>Campus</th><th>Account</th><th>Other roles</th></tr></thead><tbody>
        ${r.people.map((p) => `<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.username)}</td><td>${esc(p.branch)}</td><td><span class="pill ${stateTone(p.state)}">${esc(p.state)}</span></td>
          <td>${p.roles.filter((x) => x !== r.name).map((x) => `<span class="pill role">${esc(label(x))}</span>`).join('') || '<span class="muted">—</span>'}</td></tr>`).join('')}
      </tbody></table>` : '<p class="empty">Nobody holds this role.</p>'}
    </details>`).join('');
}

function byStaff(q) {
  const rows = STAFF.filter((s) => matches(q, s.name, s.username, s.email, s.roles.map(label).join(' '), s.roles.join(' ')));
  if (!rows.length) return '<p class="status">Nothing matches.</p>';
  return `<div class="card" style="margin-top:12px"><table><thead><tr><th>Staff</th><th>Username</th><th>Campus</th><th>Role(s) assigned</th><th>Account</th></tr></thead><tbody>
    ${rows.map((s) => `<tr><td><b>${esc(s.name)}</b><div class="small muted">${esc(s.email)}</div></td><td>${esc(s.username)}</td><td>${esc(s.branch)}</td>
      <td>${s.roles.map((x) => `<span class="pill role">${esc(label(x))}</span>`).join('') || '<span class="pill none">No role</span>'}</td>
      <td><span class="pill ${stateTone(s.state)}">${esc(s.state)}</span></td></tr>`).join('')}
  </tbody></table><p class="small muted" style="margin-top:8px">${rows.length} of ${STAFF.length} accounts</p></div>`;
}

function download() {
  const cell = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = [['Staff', 'Username', 'Campus', 'Role', 'Account'].map(cell).join(',')];
  STAFF.forEach((s) => (s.roles.length ? s.roles : ['']).forEach((r) => lines.push([s.name, s.username, s.branch, r ? label(r) : '', s.state].map(cell).join(','))));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([`﻿${lines.join('\r\n')}\r\n`], { type: 'text/csv' }));
  a.download = 'roles-and-staff.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

$('load').onclick = loadSchools;
$('school').onchange = () => schoolChanged();
$('campus').onchange = loadStaff;
$('tabRole').onclick = () => { view = 'role'; render(); };
$('tabStaff').onclick = () => { view = 'staff'; render(); };
$('q').oninput = render;
$('onlyUsed').onchange = render;
$('csv').onclick = download;
</script>
</body>
</html>
